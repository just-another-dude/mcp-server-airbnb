name: Secret Scan

# Dedicated workflow with no paths-ignore, so the secret gate can never be
# skipped by a path filter added to another workflow.
#
# It scans the checked-out tree (`--no-git`), not history. A fresh checkout
# holds only tracked files, so there is no node_modules or .env to wade through.
# Allowlist for confirmed false positives only: .gitleaks.toml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree for committed secrets
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 5
